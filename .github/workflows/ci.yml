name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Core + server tests (H2 and PostgreSQL), Docker build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tandem
          POSTGRES_USER: tandem
          POSTGRES_PASSWORD: tandem
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tandem" --health-interval 3s --health-retries 20
    env:
      TANDEM_SERVER_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests on in-memory H2
        run: ./gradlew :core:test :server:test --console=plain
      # Real concurrent transactions: this is where the per-list lock in OpStore earns its keep.
      - name: Server tests on PostgreSQL 16
        run: ./gradlew :server:cleanTest :server:test --console=plain
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/tandem?user=tandem&password=tandem
      - name: Docker image builds and answers
        run: |
          docker build -t tandem-server .
          docker run -d -p 8090:8090 --name tandem tandem-server
          for i in $(seq 30); do curl -sf localhost:8090/health && exit 0; sleep 1; done
          docker logs tandem; exit 1

  android:
    name: Android tests & APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install SDK packages (runner image ships the Android SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.1.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Release APK (R8 minified)
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Name APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Tandem-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-apk
          path: out/*.apk

  release:
    name: Publish GitHub release
    needs: [server, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: tandem-apk }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Tandem-*.apk --repo "${{ github.repository }}" \
            --title "Tandem ${{ github.ref_name }}" \
            --notes "Install the APK on any Android 8.0+ phone. Lists work offline straight away; to share them, run the sync server (one click on Render, or \`docker build\`) and enter its address in Settings."
