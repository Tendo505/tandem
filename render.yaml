# One-click deploy to Render (free tier): https://render.com/deploy?repo=https://github.com/Tendo505/tandem
services:
  - type: web
    name: tandem-sync
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tandem-db
          property: connectionString
databases:
  - name: tandem-db
    plan: free
