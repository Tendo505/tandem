# docker compose up --build   ->   sync server on http://localhost:8090 (on an emulator, enter http://10.0.2.2:8090 in the app's Settings)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tandem
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: tandem
    healthcheck:
      # -h localhost: during first-time setup postgres only listens on its socket, so this waits for the real start.
      test: ["CMD-SHELL", "pg_isready -h localhost -U tandem"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tandem:tandem@db:5432/tandem
    ports:
      - "8090:8090"
volumes:
  pgdata:
